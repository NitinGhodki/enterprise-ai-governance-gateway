server:
  port: ${PORT:8080}
  # Netty tuning for reactive stack under 300MB heap
  netty:
    connection-timeout: 10s
    idle-timeout: 60s

spring:
  application:
    name: enterprise-ai-governance-gateway

  # R2DBC — reactive PostgreSQL
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:governance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    pool:
      initial-size: 2
      max-size: 10          # kept low for memory budget
      max-idle-time: 30m
      validation-query: SELECT 1

  # Flyway uses JDBC (not R2DBC) — separate datasource
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:governance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis — semantic cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

  # Disable autoconfigured security defaults — we configure manually
  security:
    user:
      name: disabled

# JVM memory — strict budget for Railway
# Set via environment: JAVA_OPTS=-XX:MaxRAMPercentage=35
# This caps Java heap at ~300MB inside a 1GB container

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        governance.llm.latency: true

# Gateway configuration
gateway:
  jwt:
    secret: ${JWT_SECRET:changeme-minimum-32-chars-required-here}
    expiry-hours: 24

  governance:
    base-url: ${GOVERNANCE_URL:http://localhost:8000}
    timeout-seconds: 30
    # Bypass governance for health checks
    bypass-paths:
      - /actuator/**
      - /api/v1/auth/**

  rate-limit:
    # Default: 20 requests per minute per user
    requests-per-minute: ${RATE_LIMIT_RPM:5}
    # Burst: 5 extra requests allowed before throttling
    burst-capacity: ${RATE_LIMIT_BURST:2}

  llm:
    huggingface:
      base-url: https://api-inference.huggingface.co/v1
      api-key: ${HF_API_KEY:}
      model: ${HF_MODEL:mistralai/Mistral-7B-Instruct-v0.3}
      timeout-seconds: 60
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:mistral}
      timeout-seconds: 120
    # Default provider: huggingface | ollama
    default-provider: ${LLM_PROVIDER:huggingface}

  cache:
    # Semantic similarity threshold: 0.92 = 92% similar = cache hit
    similarity-threshold: 0.92
    ttl-hours: 1

logging:
  level:
    com.aigovernance: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    io.r2dbc: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"                                                                             